name: Build Windows app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish
        run: dotnet publish OtoPlayer/OtoPlayer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o dist/win-x64
      - name: Include notices
        shell: pwsh
        run: Copy-Item README.md,THIRD-PARTY-NOTICES.txt dist/win-x64/
      - uses: actions/upload-artifact@v4
        with:
          name: OtoPlayer-win-x64
          path: dist/win-x64/
